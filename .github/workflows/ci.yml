name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install
        run: pip install -r app/requirements.txt duckdb==1.5.6 pytest==9.1.1 ruff==0.17.1
      - name: Lint
        run: ruff check src app tests
      - name: Test
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t retailpulse .
      - name: Run container and check health
        run: |
          docker run -d -p 8501:8501 --name rp retailpulse
          for i in $(seq 1 30); do
            curl -sf http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs rp
          exit 1
